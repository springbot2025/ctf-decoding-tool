[package]
name    = "ctf-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ctf-app"
path = "src/main.rs"

[dependencies]
ctf-core   = { path = "../../crates/ctf-core" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tauri      = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
